<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>중1 식생활 서바이벌 : 건강한 하루를 완성하라!</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --secondary: #10b981;
      --accent: #f59e0b;
      --danger: #ef4444;
      --purple: #8b5cf6;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 50%, #fef3c7 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    #app {
      width: 100%;
      max-width: 1024px;
      min-height: 100vh;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* 상단 헤더바 */
    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 12px 18px;
      background: #1e293b;
      color: #fff;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .topbar-title {
      font-weight: 800;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge-pill-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .mini-badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      background: #334155;
      color: #94a3b8;
      border: 1px solid #475569;
      transition: all 0.3s;
    }

    .mini-badge.earned {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #1e293b;
      border-color: #fde68a;
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
    }

    .icon-btn {
      background: #334155;
      color: #fff;
      border: 1px solid #475569;
      border-radius: 10px;
      padding: 7px 12px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: transform 0.1s, background 0.2s;
    }

    .icon-btn:active { transform: scale(0.96); }
    .icon-btn.danger { background: #7f1d1d; border-color: #991b1b; }

    /* 메인 컨테이너 */
    .main-content {
      flex: 1;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* 버튼 공통 */
    .btn {
      border: none;
      border-radius: 16px;
      padding: 14px 22px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.12s, box-shadow 0.2s, opacity 0.2s;
      min-height: 52px;
    }

    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .btn-success {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .btn-warning {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    }

    .btn-battle {
      width: 100%;
      min-height: 60px;
      font-size: 1.2rem;
      letter-spacing: -0.3px;
      border-radius: 18px;
    }

    .btn-outline {
      background: #fff;
      color: var(--text);
      border: 2px solid var(--border);
    }

    /* 독립 대결 액션 박스 */
    .battle-action-box {
      background: linear-gradient(135deg, #eff6ff, #f0fdf4);
      border: 2.5px solid #93c5fd;
      border-radius: 20px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.12);
    }

    /* 오프닝 및 스토리 카드 */
    .hero-card {
      background: var(--card);
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: var(--shadow);
      text-align: center;
      border: 2px solid #e0f2fe;
      animation: fadeIn 0.4s ease;
    }

    .hero-tag {
      display: inline-block;
      background: #dbeafe;
      color: #1d4ed8;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }

    .hero-title {
      font-size: 1.9rem;
      font-weight: 900;
      margin: 0 0 8px;
      line-height: 1.25;
      color: #0f172a;
    }

    .hero-sub {
      font-size: 1.08rem;
      color: var(--muted);
      margin: 0 0 20px;
      line-height: 1.6;
    }

    .story-box {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 18px;
      padding: 18px;
      text-align: left;
      font-size: 1.02rem;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    /* 스테이지 2 학교급식 전용 일러스트 카드 */
    .school-lunch-scene {
      background: linear-gradient(135deg, #fef9c3 0%, #dcfce7 50%, #e0f2fe 100%);
      border: 3px solid #86efac;
      border-radius: 24px;
      padding: 22px 18px;
      margin: 14px 0 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.15);
    }

    .lunch-tray-visual {
      background: #ffffff;
      border: 4px solid #cbd5e1;
      border-radius: 22px;
      padding: 16px;
      max-width: 540px;
      margin: 0 auto;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.06), 0 6px 16px rgba(0, 0, 0, 0.08);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .tray-slot {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      animation: floatItem 2.8s ease-in-out infinite;
    }

    .tray-slot:nth-child(2) { animation-delay: 0.3s; }
    .tray-slot:nth-child(3) { animation-delay: 0.6s; }
    .tray-slot:nth-child(4) { animation-delay: 0.9s; }
    .tray-slot.wide { grid-column: span 2; background: #fffbeb; border-color: #fde68a; }

    .tray-slot-emoji { font-size: 2.3rem; line-height: 1.1; }
    .tray-slot-label { font-size: 0.82rem; font-weight: 800; color: #334155; }

    /* 몬스터 대결 배너 */
    .monster-arena {
      background: linear-gradient(135deg, #1e1b4b, #312e81);
      color: #fff;
      border-radius: 20px;
      padding: 16px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: var(--shadow);
    }

    .monster-info {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 260px;
    }

    .monster-avatar {
      font-size: 3.2rem;
      background: rgba(255, 255, 255, 0.12);
      width: 74px;
      height: 74px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .monster-avatar.shake { animation: shake 0.45s ease; }

    .monster-name {
      font-size: 1.15rem;
      font-weight: 800;
      color: #fde047;
      margin-bottom: 4px;
    }

    .monster-quote {
      font-size: 0.95rem;
      color: #e2e8f0;
      background: rgba(0, 0, 0, 0.25);
      padding: 6px 12px;
      border-radius: 10px;
      display: inline-block;
    }

    .hp-box {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .hp-label { font-size: 0.85rem; font-weight: 700; color: #cbd5e1; }
    .hp-bars { display: flex; gap: 8px; }

    .hp-cell {
      width: 38px;
      height: 18px;
      border-radius: 6px;
      background: #ef4444;
      border: 2px solid #fca5a5;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
      transition: all 0.35s;
    }

    .hp-cell.lost {
      background: #334155;
      border-color: #475569;
      box-shadow: none;
    }

    /* 돌발 이벤트 & 미션 상태바 */
    .event-banner {
      background: #fef3c7;
      border: 2px solid #f59e0b;
      color: #92400e;
      padding: 12px 16px;
      border-radius: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .status-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
    }

    .stat-card {
      background: #fff;
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-title { font-size: 0.8rem; color: var(--muted); font-weight: 700; }
    .stat-value { font-size: 1.05rem; font-weight: 800; color: var(--text); }

    /* 식품군 칩 */
    .group-chips { display: flex; flex-wrap: wrap; gap: 6px; }

    .group-chip {
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      background: #f1f5f9;
      color: #64748b;
      border: 1.5px solid #cbd5e1;
    }

    .group-chip.active {
      background: #dcfce7;
      color: #166534;
      border-color: #22c55e;
    }

    /* 식판 / 장바구니 영역 */
    .tray-section {
      background: #ffffff;
      border: 2.5px dashed #93c5fd;
      border-radius: 20px;
      padding: 14px 16px;
    }

    .tray-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tray-items {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      min-height: 60px;
      align-items: center;
    }

    .tray-item {
      background: #eff6ff;
      border: 2px solid #60a5fa;
      border-radius: 14px;
      padding: 8px 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .tray-item:active { transform: scale(0.95); }

    .tray-remove {
      background: #ef4444;
      color: #fff;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 900;
    }

    /* 식품군 필터 탭 */
    .filter-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .filter-tab {
      padding: 8px 14px;
      border-radius: 999px;
      border: 2px solid var(--border);
      background: #fff;
      color: var(--muted);
      font-weight: 800;
      font-size: 0.88rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .filter-tab.active {
      background: #1e293b;
      color: #fff;
      border-color: #1e293b;
    }

    /* 음식 선택 그리드 */
    .food-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(152px, 1fr));
      gap: 12px;
    }

    .food-card {
      background: #fff;
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .food-card.sold-out { opacity: 0.45; background: #f1f5f9; }
    .food-card.in-tray { border-color: #3b82f6; background: #f0f9ff; }

    .food-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .food-emoji { font-size: 2.2rem; line-height: 1; }

    .inspect-btn {
      background: #f1f5f9;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      padding: 5px 8px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      color: #334155;
    }

    .inspect-btn.checked {
      background: #dcfce7;
      border-color: #22c55e;
      color: #166534;
    }

    .food-name { font-weight: 800; font-size: 0.98rem; color: #0f172a; }

    .food-meta {
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 2px;
    }

    .food-add-btn {
      width: 100%;
      padding: 9px;
      border-radius: 10px;
      border: none;
      background: #e0f2fe;
      color: #0369a1;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .food-add-btn:disabled {
      background: #e2e8f0;
      color: #94a3b8;
      cursor: not-allowed;
    }

    /* 경로 선택 카드 */
    .path-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin-top: 12px;
    }

    .path-card {
      background: #fff;
      border: 3px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.2s;
    }

    .path-card:hover { border-color: var(--primary); transform: translateY(-3px); }

    /* 모달 팝업 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
      animation: fadeIn 0.2s ease;
    }

    .modal-box {
      background: #fff;
      border-radius: 24px;
      max-width: 520px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      max-height: 90vh;
      overflow-y: auto;
    }

    .nutrition-table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0;
      border: 2px solid #0f172a;
    }

    .nutrition-table th,
    .nutrition-table td {
      border: 1px solid #cbd5e1;
      padding: 10px 12px;
      text-align: left;
      font-size: 0.95rem;
    }

    .nutrition-table th { background: #f8fafc; width: 45%; }

    /* 엔딩 및 실천 다짐 */
    .pledge-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
      margin: 16px 0;
    }

    .pledge-btn {
      padding: 14px;
      border-radius: 14px;
      border: 2px solid #cbd5e1;
      background: #fff;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s, border-color 0.15s;
    }

    .pledge-btn:hover { border-color: #3b82f6; background: #f8fafc; }

    .pledge-btn.selected {
      border-color: #10b981;
      background: #ecfdf5;
      color: #065f46;
    }

    #fireworksCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 90;
    }

    .disclaimer-footer {
      text-align: center;
      font-size: 0.78rem;
      color: #64748b;
      padding: 12px 16px;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes floatItem {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px) rotate(-4deg); }
      40% { transform: translateX(8px) rotate(4deg); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }

    @media (max-width: 600px) {
      .hero-title { font-size: 1.45rem; }
      .food-grid { grid-template-columns: repeat(2, 1fr); }
      .lunch-tray-visual { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <canvas id="fireworksCanvas"></canvas>
  <div id="app">
    <header class="topbar">
      <div class="topbar-title">
        <span>🍱 중1 식생활 서바이벌</span>
      </div>
      <div class="topbar-controls">
        <div class="badge-pill-row" id="headerBadges"></div>
        <button class="icon-btn" id="soundToggleBtn" onclick="toggleSound()">🔊 효과음 ON</button>
        <button class="icon-btn" id="skipToggleBtn" onclick="toggleFastMode()">⏩ 연출 보통</button>
        <button class="icon-btn danger" onclick="confirmReset()">🔄 처음부터</button>
      </div>
    </header>

    <main class="main-content" id="mainContainer"></main>

    <footer class="disclaimer-footer">
      ※ 본 게임의 영양 수치는 초등학교 6학년 식생활 학습을 돕기 위한 <strong>교육용 간이 지표</strong>이며, 특정 음식을 나쁜 음식으로 단정하지 않고 전체 식단의 균형을 배우는 데 목적이 있습니다.
    </footer>
  </div>

  <div id="modalRoot"></div>

  <script>
    /**
     * =========================================================================
     * [교사용 설정 영역: GAME_CONFIG]
     * 비개발자 선생님도 아래 음식, 가격, 이벤트, 퀴즈, 몬스터 대사를 수정할 수 있습니다.
     * =========================================================================
     */
    const GAME_CONFIG = {
      foodGroups: {
        grain: { id: 'grain', name: '곡류·주식', emoji: '🍚' },
        protein: { id: 'protein', name: '단백질', emoji: '🥚' },
        veggie: { id: 'veggie', name: '채소류', emoji: '🥬' },
        fruit: { id: 'fruit', name: '과일류', emoji: '🍎' },
        dairy: { id: 'dairy', name: '우유·유제품', emoji: '🥛' },
        snack: { id: 'snack', name: '음료·간식', emoji: '🥤' }
      },

      monsters: {
        breakfast: {
          name: '아침잠 몬스터',
          emoji: '😴',
          maxHp: 3,
          taunt: '"조금만 더 자! 아침밥은 그냥 건너뛰어!"',
          defeatQuote: '"크윽... 아침밥 에너지를 이길 수 없어!"'
        },
        home: {
          name: '균형 실종 몬스터',
          emoji: '🍽️',
          maxHp: 3,
          taunt: '"반찬은 좋아하는 것 하나면 충분해! 채소는 빼!"',
          defeatQuote: '"알록달록 균형 식판 앞에 무릎을 꿇는다..."'
        },
        store: {
          name: '달콤짭짤 몬스터',
          emoji: '😈',
          maxHp: 3,
          taunt: '"영양표시는 볼 필요 없어! 달고 짠 게 최고야!"',
          defeatQuote: '"예산 안에서 영양까지 챙기는 편의점 탐정에게 졌다!"'
        }

    /**
     * =========================================================================
     * [사운드 엔진 - Web Audio API]
     * =========================================================================
     */
    const SoundFX = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
      },
      play(type) {
        if (!state.soundOn) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        if (type === 'pop') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(780, now + 0.09);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
        } else if (type === 'hit') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.exponentialRampToValueAtTime(90, now + 0.25);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
          osc.start(now);
          osc.stop(now + 0.26);
        } else if (type === 'win') {
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, idx) => {
            const o = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            o.type = 'triangle';
            o.frequency.setValueAtTime(freq, now + idx * 0.1);
            g.gain.setValueAtTime(0.16, now + idx * 0.1);
            g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.25);
            o.connect(g);
            g.connect(this.ctx.destination);
            o.start(now + idx * 0.1);
            o.stop(now + idx * 0.1 + 0.25);
          });
        } else if (type === 'fail') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.linearRampToValueAtTime(140, now + 0.35);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
          osc.start(now);
          osc.stop(now + 0.36);
        }
      }
    };

    /**

    const STORAGE_KEY = 'diet_survival_g6_save_v2';

    const defaultState = () => ({
      screen: 'intro', // intro | stage1 | stage2 | stage3_choice | stage3_home | stage3_store | ending
      soundOn: true,
      fastMode: false,
      badges: [],
      // 필터 탭 상태
      s1Filter: 'all',
      homeFilter: 'all',
      storeFilter: 'all',
      // 스테이지 1
      s1Tray: [],
      s1Event: null,
      s1Hp: 3,
      s1Cleared: false,
      // 스테이지 3 공통
      dinnerPath: null,
      // 스테이지 3-A (집밥)
      homeTray: [],
      homeEvent: null,
      homeHp: 3,
      homeCleared: false,
      homeQuizIndex: null,
      // 스테이지 3-B (편의점)

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return { ...defaultState(), ...JSON.parse(raw) };
      } catch (e) {}
      return defaultState();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
      renderHeader();
    }

    function resetGame() {
      stopFireworks();
      const keepSound = state.soundOn;
      state = defaultState();
      state.soundOn = keepSound;
      saveState();
      closeModal();
      render();

    /**
     * =========================================================================
     * [핵심 판정 엔진: 몬스터 HP 3칸 차감 로직]
     * =========================================================================
     */
    function evaluateBreakfast(trayIds) {
      const items = trayIds.map(id => GAME_CONFIG.breakfastFoods.find(f => f.id === id)).filter(Boolean);
      const groups = new Set(items.map(i => i.group));
      const hasGrain = groups.has('grain');
      const hasProteinOrDairy = groups.has('protein') || groups.has('dairy');
      const hasProduce = groups.has('fruit') || groups.has('veggie');
      const highSugarCount = items.filter(i => i.sugar === '매우 높음').length;
      const onlySnack = items.length > 0 && items.every(i => i.group === 'snack');

      const criteria = [
        {
          passed: items.length >= 2 && !onlySnack && hasGrain,
          passMsg: '① 아침을 거르지 않고 든든한 곡류 에너지를 챙겼어요! (HP -1)',
          failHint: '아침 빈속을 깨워줄 곡류(밥, 식빵, 모닝빵, 고구마, 오트밀 등)가 필요해요!'
        },
        {
          passed: hasProteinOrDairy,
          passMsg: '② 성장기 집중력을 높여주는 단백질/우유군을 조합했어요! (HP -1)',
          failHint: '달걀, 두부, 닭가슴살 소시지, 우유, 두유, 요거트 중 하나를 추가해 보세요!'
        },
        {
          passed: hasProduce && highSugarCount <= 1,
          passMsg: '③ 상큼한 채소/과일을 더하고 단 음식 의존을 줄였어요! (HP -1)',
          failHint: highSugarCount > 1
            ? '단 음식(초코도넛·초코우유) 비중이 높아요! 물이나 흰 우유·과일로 균형을 맞춰 보세요.'
            : '비타민을 채워줄 과일(바나나, 사과, 귤, 키위)이나 채소(방울토마토, 오이, 김)를 더해 보세요!'
        }
      ];

      const passedCount = criteria.filter(c => c.passed).length;
      const remainingHp = Math.max(0, 3 - passedCount);
      return { items, groups, criteria, passedCount, remainingHp };
    }

    function evaluateHomeDinner(trayIds) {
      const items = trayIds.map(id => GAME_CONFIG.homeFoods.find(f => f.id === id)).filter(Boolean);
      const groups = new Set(items.map(i => i.group));
      const hasGrain = groups.has('grain');
      const hasProtein = groups.has('protein');
      const hasVeggieOrFruit = groups.has('veggie') || groups.has('fruit');
      const highSodiumCount = items.filter(i => i.sodium === '높음').length;
      const distinctCount = new Set(items.map(i => i.id)).size;

      const criteria = [
        {
          passed: hasGrain && distinctCount >= 3,
          passMsg: '① 밥과 여러 반찬을 조화롭게 구성해 편식을 막았어요! (HP -1)',
          failHint: '밥(곡류)을 포함해 서로 다른 음식 3가지 이상으로 식판을 채워 보세요!'
        },
        {
          passed: hasProtein,
          passMsg: '② 튼튼한 몸을 만드는 단백질 반찬을 챙겼어요! (HP -1)',
          failHint: '달걀말이, 두부구이, 생선구이, 불고기, 닭봉조림, 멸치볶음 등 단백질 반찬을 추가해 보세요!'
        },
        {
          passed: hasVeggieOrFruit && highSodiumCount <= 1,
          passMsg: '③ 채소·과일을 충분히 곁들이고 짠 반찬 균형을 맞췄어요! (HP -1)',
          failHint: highSodiumCount > 1
            ? '김치·햄·소시지 등 짠 반찬이 겹쳤어요! 나물이나 두부, 물로 염분 균형을 맞춰 보세요.'
            : '시금치나물, 오이무침, 브로콜리, 국 건더기 또는 과일을 추가해 비타민을 채워 보세요!'
        }
      ];

      const passedCount = criteria.filter(c => c.passed).length;
      const remainingHp = Math.max(0, 3 - passedCount);
      return { items, groups, criteria, passedCount, remainingHp };
    }

    function evaluateStoreDinner(cartIds, inspectedIds, budgetLimit) {
      const items = cartIds.map(id => GAME_CONFIG.storeFoods.find(f => f.id === id)).filter(Boolean);
      const totalCost = items.reduce((sum, i) => sum + i.price, 0);
      const withinBudget = totalCost <= budgetLimit && items.length > 0;

      const groups = new Set(items.map(i => i.group));
      const hasGrain = groups.has('grain');
      const hasProteinOrDairy = groups.has('protein') || groups.has('dairy');
      const hasVeggieOrFruit = groups.has('veggie') || groups.has('fruit');

      const highSugarOrSodium = items.filter(i => i.sugarLevel === '매우 높음' || i.sodiumLevel === '매우 높음').length;
      const inspectedCount = inspectedIds.length;

      const criteria = [
        {
          passed: withinBudget && hasGrain && hasProteinOrDairy,
          passMsg: `① 예산(${budgetLimit.toLocaleString()}원) 안에서 주식과 단백질을 알뜰하게 챙겼어요! (HP -1)`,
          failHint: !withinBudget
            ? `예산(${budgetLimit.toLocaleString()}원)을 초과했거나 장바구니가 비어 있어요!`
            : '삼각김밥·김밥·샌드위치·도시락 같은 주식과 달걀·닭가슴살·우유·두유를 조합해 보세요!'
        },
        {
          passed: hasVeggieOrFruit && highSugarOrSodium === 0,
          passMsg: '② 채소/과일을 챙기고 고당류·고나트륨 식품 의존을 피했어요! (HP -1)',
          failHint: highSugarOrSodium > 0
            ? '탄산음료·바나나맛우유(당류 높음)나 컵라면·떡볶이(나트륨 높음) 대신 물·흰우유·김밥·샐러드로 바꾸면 건강해요!'
            : '편의점에서 놓치기 쉬운 샐러드, 방울토마토컵, 바나나, 과일컵, 사과 중 하나를 꼭 담아 보세요!'
        },
        {
          passed: inspectedCount >= 2,
          passMsg: `③ 돋보기(🔍)로 상품 ${inspectedCount}개의 영양표시를 꼼꼼히 확인했어요! (HP -1)`,
          failHint: '상품 카드의 [🔍 영양표시] 버튼을 눌러 최소 2개 이상의 당류·나트륨을 비교해 보세요!'
        }
      ];

      const passedCount = criteria.filter(c => c.passed).length;
      const remainingHp = Math.max(0, 3 - passedCount);
      return { items, totalCost, withinBudget, groups, criteria, passedCount, remainingHp };
    }

      state.storeEvent = nextEv;
      state.storeCart = state.storeCart.filter(id => !state.storeEvent.soldOutIds.includes(id));

    function showModal(html) {
      document.getElementById('modalRoot').innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
          <div class="modal-box">${html}</div>
        </div>
      `;
    }

    function closeModal() {
      document.getElementById('modalRoot').innerHTML = '';
    }

    let fwInterval = null;
    function startFireworks() {
      const canvas = document.getElementById('fireworksCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      let particles = [];

      function createBurst() {
        const x = Math.random() * canvas.width * 0.8 + canvas.width * 0.1;
        const y = Math.random() * canvas.height * 0.4 + canvas.height * 0.1;
        const colors = ['#f59e0b', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6'];
        const color = colors[Math.floor(Math.random() * colors.length)];
        for (let i = 0; i < 36; i++) {
          const angle = (Math.PI * 2 * i) / 36;
          const speed = Math.random() * 4 + 2;
          particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            alpha: 1,
            color
          });
        }
      }

      createBurst();
      fwInterval = setInterval(createBurst, 850);

      function loop() {
        if (!fwInterval) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.06;
          p.alpha -= 0.015;
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
          ctx.fill();
        });
        particles = particles.filter(p => p.alpha > 0);
        requestAnimationFrame(loop);
      }
      loop();
    }

    function stopFireworks() {
      if (fwInterval) {
        clearInterval(fwInterval);
        fwInterval = null;
      }
      const canvas = document.getElementById('fireworksCanvas');
      if (canvas) {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    // 초기 실행
    render();
  </script>
